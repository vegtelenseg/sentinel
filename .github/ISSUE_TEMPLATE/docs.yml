name: Documentation
description: Fix or improve AGENTS.md, VitePress docs, or examples
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for docs, `AGENTS.md`, or example mismatches with the shipped API.
        For behavior bugs, use **Bug report**. For new library features, use **Feature request**.

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Quote the current text or link to the page if you can.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should it say instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package / docs version
      placeholder: e.g. 1.0.0
      description: npm version or `main` if this is about the docs site.
    validations:
      required: true
